    <header>

          <div class="hotStars">

            <p>Hotel</p>
          </div>

          <div class="title">
            <h2 id="hotTitle"></h2>
            <p id="hotAddress"></p>
          </div>

          <div class="infoReview">
            <div class="infoReviewRevDiv">
              <i class="fa fa-solid fa-star"></i>
              <p class="infoReviewRev" id="infoReviewRev"></p>
            </div>

            <p class="infoReviewRooms" id="infoReviewRooms"></p>
          </div>

          <p class="hotDesc" id="hotDesc"></p>
        </div>
      </section>

      <section class="filtersSect"></section>
