<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/CSS/pages/registration/signin.css" />
  </head>
  <body>
    <section class="asideSect">
      <div class="titles">
        <div>
          <i class="fa fa-regular fa-building"></i>
        </div>
        <h2>STEP BOOKING</h2>
        <p>
          Book your perfect hotel stay in minutes with instant confirmation and
          real guest reviews.
        </p>
      </div>

      <div class="info">
        <div>
          <h3>50K+</h3>
          <p>Bookings</p>
        </div>

        <div>
          <h3>200+</h3>
          <p>Hotels</p>
        </div>

        <div>
          <h3>24/7</h3>
          <p>Guest Support</p>
        </div>
      </div>
    </section>

    <section class="formSect">
      <div class="topDiv">
        <a href="/HTML/index.html"
          ><button>
            <i class="fa fa-solid fa-arrow-right-from-bracket"></i></button
        ></a>

        <h2>Welcome Back</h2>
        <p>Sign in to manage your bookings 🏨</p>
      </div>

      <form action="" id="signInForm">
        <input
          type="email"
          name=""
          id="signInEmailVal"
          placeholder="Email address"
          required
        />
        <input
          type="text"
          name=""
          id="signInPasswordVal"
          placeholder="Password"
          required
        />
        <div>
          <div class="rememberDiv">
            <input type="checkbox" name="rememberme" id="signInRememberMe" />
            <label for="rememberme">Remember me</label>
          </div>
          <a href="/auth/reset-password.html">forgot password?</a>
        </div>
        <input type="submit" name="" id="" value="Sign In" class="sumbitBtn" />
      </form>

      <div class="divider">
        <div></div>
        <p>or</p>
        <div></div>
      </div>

      <div class="signUpDiv">
        <p>
          Don't have an account?
          <span><a href="signup.html">Create one now</a></span>
        </p>
      </div>
    </section>
  </body>
  <script type="module" src="/JS/AUTH/SIGNIN.js"></script>
</html>
